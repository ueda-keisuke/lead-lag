[project]
name = "lead-lag-backend"
version = "0.1.0"
description = "Lead-lag investment signal generator using subspace-regularized PCA"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
