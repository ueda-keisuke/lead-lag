name: Daily Signal Generation

on:
  schedule:
    # 23:30 UTC Mon-Fri (after US market close + data lag, before Asia open)
    # = 08:30 JST next day, 16:30 PDT same day
    - cron: '30 23 * * 1-5'
  workflow_dispatch: {}

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ./backend

      - name: Generate signals
        run: python -m src.main --config config/market_pairs.yaml --output ../data/
        working-directory: backend

      - name: Copy data to frontend
        run: cp -r data/* frontend/public/data/

      - name: Commit and push
        run: |
          git config user.name "lead-lag-bot"
          git config user.email "bot@lead-lag.dev"
          git add data/ frontend/public/data/
          git diff --cached --quiet || git commit -m "Update signals for $(date +%Y-%m-%d)"
          git push
